
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Public Contact Directory Nigeria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --blue:#2457d6;
  --dark:#14254a;
  --green:#087443;
  --red:#c62828;
  --gold:#f0b429;
  --bg:#f4f7fc;
  --text:#17233c;
  --muted:#667085;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header {
  background:var(--dark);
  color:white;
  padding:20px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
header h2 {margin:0;font-size:20px}
header span {color:#80b5ff}
main {max-width:1200px;margin:35px auto;padding:0 18px}
.panel {
  background:white;
  border-radius:14px;
  padding:25px;
  box-shadow:0 5px 22px #17233c12;
  margin-bottom:22px;
}
h1,h2,h3 {margin-top:0}
input,select,button {
  font:inherit;
  border-radius:8px;
}
input,select {
  width:100%;
  padding:13px;
  border:1px solid #d5deeb;
  margin:7px 0 15px;
}
button {
  border:0;
  padding:11px 16px;
  color:white;
  background:var(--blue);
  font-weight:bold;
  cursor:pointer;
}
button:disabled {opacity:.6;cursor:not-allowed}
button:hover {opacity:.9}
.login-box {max-width:430px;margin:60px auto}
.hidden {display:none!important}
.muted {color:var(--muted)}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.stat {
  background:#f5f8ff;
  padding:18px;
  border-radius:10px;
}
.stat strong {display:block;font-size:28px;margin-top:7px}
.badge {
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.pending {background:#fff1c9;color:#805600}
.verified {background:#dff5e8;color:#087443}
.rejected {background:#ffe5e5;color:#b42318}
.contact {
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:18px;
  margin-top:15px;
}
.contact h3 {margin:10px 0}
.contact p {margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:15px;
}
.approve {background:var(--green)}
.reject {background:var(--red)}
.secondary {background:#475467}
#message {margin:12px 0;font-weight:bold}
.toolbar {
  display:grid;
  grid-template-columns:1fr 220px;
  gap:12px;
}
.toolbar input,.toolbar select {margin:0}
@media(max-width:650px) {
  .stats {grid-template-columns:1fr}
  .toolbar {grid-template-columns:1fr}
  header {align-items:flex-start}
}
</style>
</head>

<body>

<header>
  <h2>PUBLIC CONTACT <span>DIRECTORY</span> — ADMIN</h2>
  <button id="logoutButton" class="hidden">Log out</button>
</header>

<main>

<section id="loginSection" class="panel login-box">
  <h2>Administrator Login</h2>
  <p class="muted">Sign in with your registered administrator account.</p>

  <form id="loginForm">
    <label>Email address</label>
    <input id="email" type="email" required autocomplete="username"
      placeholder="Your administrator email">

    <label>Password</label>
    <input id="password" type="password" required
      autocomplete="current-password" placeholder="Your password">

    <button id="loginButton" type="submit" style="width:100%">
      Sign in
    </button>
  </form>

  <p id="loginMessage" role="status"></p>
</section>

<section id="dashboardSection" class="hidden">

  <div class="panel">
    <h1>Administrator Dashboard</h1>
    <p class="muted">Review public contact information before approving it.</p>

    <div class="stats">
      <div class="stat">
        Pending
        <strong id="pendingCount">0</strong>
      </div>
      <div class="stat">
        Verified
        <strong id="verifiedCount">0</strong>
      </div>
      <div class="stat">
        Rejected
        <strong id="rejectedCount">0</strong>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Manage Contacts</h2>

    <div class="toolbar">
      <input id="searchContacts" type="search"
        placeholder="Search by name or organisation">

      <select id="statusFilter">
        <option value="all">All contacts</option>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <p id="message" role="status"></p>
    <div id="contactList"></div>
  </div>

</section>
</main>

<script>
"use strict";

// Your existing Supabase project connection.
const SUPABASE_URL = "https://xcxfhendyozxaktdckbi.supabase.co";
const SUPABASE_KEY = "sb_publishable_ejmz1U8SXMYBJHXB_YQ7SQ_XsrQ4Y1e";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById("loginSection");
const dashboardSection = document.getElementById("dashboardSection");
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");
const message = document.getElementById("message");
const contactList = document.getElementById("contactList");
const logoutButton = document.getElementById("logoutButton");

let currentUser = null;
let contacts = [];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#c62828" : "#087443";
}

function getName(contact) {
  return contact.full_name ||
    contact.organization ||
    contact.name ||
    contact.office_name ||
    "Unnamed contact";
}

function getStatus(contact) {
  return contact.verification_status || "pending";
}

function updateStatistics() {
  document.getElementById("pendingCount").textContent =
    contacts.filter(c => getStatus(c) === "pending").length;

  document.getElementById("verifiedCount").textContent =
    contacts.filter(c => getStatus(c) === "verified").length;

  document.getElementById("rejectedCount").textContent =
    contacts.filter(c => getStatus(c) === "rejected").length;
}

async function loadContacts() {
  showMessage("Loading contacts...");

  try {
    const { data, error } = await db
      .from("public_contacts")
      .select("*")
      .order("created_at", { ascending:false });

    if (error) throw error;

    contacts = data || [];
    updateStatistics();
    renderContacts();
    showMessage("Contacts loaded successfully.");
  } catch (error) {
    console.error(error);
    showMessage("Could not load contacts: " + error.message, true);
  }
}

function renderContacts() {
  const search = document.getElementById("searchContacts")
    .value.trim().toLowerCase();

  const filter = document.getElementById("statusFilter").value;

  const filtered = contacts.filter(contact => {
    const name = getName(contact).toLowerCase();
    const organisation = String(contact.organization || "").toLowerCase();
    const status = getStatus(contact);

    return (
      (name.includes(search) || organisation.includes(search)) &&
      (filter === "all" || status === filter)
    );
  });

  if (!filtered.length) {
    contactList.innerHTML =
      '<div class="contact"><p>No matching contacts found.</p></div>';
    return;
  }

  contactList.innerHTML = filtered.map(contact => {
    const status = getStatus(contact);
    const badgeClass =
      status === "verified" ? "verified" :
      status === "rejected" ? "rejected" : "pending";

    const id = escapeHTML(contact.id);

    return `
      <article class="contact">
        <span class="badge ${badgeClass}">
          ${escapeHTML(status.toUpperCase())}
        </span>

        <h3>${escapeHTML(getName(contact))}</h3>

        <p><strong>Organisation:</strong>
          ${escapeHTML(contact.organization || "Not supplied")}</p>

        <p><strong>Title:</strong>
          ${escapeHTML(contact.official_title || "Not supplied")}</p>

        <p><strong>Category:</strong>
          ${escapeHTML(contact.category || "Not supplied")}</p>

        <p><strong>State:</strong>
          ${escapeHTML(contact.state || "Not supplied")}</p>

        <p><strong>Phone:</strong>
          ${escapeHTML(contact.public_phone || "Not supplied")}</p>

        <p><strong>Email:</strong>
          ${escapeHTML(contact.public_email || "Not supplied")}</p>

        <p><strong>Current source:</strong>
          ${escapeHTML(contact.contact_source || "Not supplied")}</p>

        <p><strong>Verification source:</strong>
          ${escapeHTML(contact.verification_source_url || "Not supplied")}</p>

        <p><strong>Last verified:</strong>
          ${escapeHTML(contact.verified_at || "Not verified")}</p>

        <div class="actions">
          <button class="approve" data-action="approve" data-id="${id}">
            Approve
          </button>

          <button class="reject" data-action="reject" data-id="${id}">
            Reject
          </button>
        </div>
      </article>
    `;
  }).join("");
}

async function changeStatus(id, status) {
  const contact = contacts.find(c => String(c.id) === String(id));
  if (!contact) return;

  let source = "";
  let notes = "";
  let reverifyDate = null;

  if (status === "verified") {
    source = prompt(
      "Enter the official source URL used to verify this contact:"
    );

    if (!source) {
      showMessage("Approval cancelled. A verification source is required.", true);
      return;
    }

    try {
      const url = new URL(source);
      if (url.protocol !== "https:" && url.protocol !== "http:") {
        throw new Error("Invalid URL");
      }
      source = url.href;
    } catch (_) {
      showMessage("Please enter a valid official website URL.", true);
      return;
    }

    notes = prompt("Optional verification notes:") || "";

    const reviewDate = new Date();
    reviewDate.setMonth(reviewDate.getMonth() + 6);
    reverifyDate = reviewDate.toISOString().slice(0, 10);
  }

  if (status === "rejected") {
    const confirmed = confirm(
      "Are you sure you want to reject this contact?"
    );
    if (!confirmed) return;
    notes = prompt("Reason for rejection (optional):") || "";
  }

  showMessage("Updating contact...");

  const updates = {
    verification_status: status,
    verified_by: status === "verified" ? currentUser.id : null,
    verified_at: status === "verified" ? new Date().toISOString() : null,
    verification_source_url: status === "verified" ? source : null,
    verification_notes: notes,
    reverify_at: reverifyDate
  };

  try {
    const { error } = await db
      .from("public_contacts")
      .update(updates)
      .eq("id", id);

    if (error) throw error;

    showMessage("Contact status updated successfully.");
    await loadContacts();
  } catch (error) {
    console.error(error);
    showMessage("Update failed: " + error.message, true);
  }
}

contactList.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const id = button.dataset.id;
  const action = button.dataset.action;

  if (action === "approve") {
    changeStatus(id, "verified");
  } else if (action === "reject") {
    changeStatus(id, "rejected");
  }
});

loginForm.addEventListener("submit", async event => {
  event.preventDefault();

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "Signing in...";
  loginMessage.textContent = "";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    currentUser = data.user;

    const { data: isAdmin, error: adminError } =
      await db.rpc("is_directory_admin");

    if (adminError) throw adminError;

    if (!isAdmin) {
      await db.auth.signOut();
      currentUser = null;
      throw new Error("This account is not an authorised administrator.");
    }

    loginSection.classList.add("hidden");
    dashboardSection.classList.remove("hidden");
    logoutButton.classList.remove("hidden");

    await loadContacts();

  } catch (error) {
    console.error(error);
    loginMessage.textContent = error.message;
    loginMessage.style.color = "#c62828";
  } finally {
    button.disabled = false;
    button.textContent = "Sign in";
  }
});

logoutButton.addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  contacts = [];

  dashboardSection.classList.add("hidden");
  logoutButton.classList.add("hidden");
  loginSection.classList.remove("hidden");
  loginForm.reset();
  loginMessage.textContent = "";
});

document.getElementById("searchContacts")
  .addEventListener("input", renderContacts);

document.getElementById("statusFilter")
  .addEventListener("change", renderContacts);

// Restore an existing administrator session safely.
async function checkExistingSession() {
  const { data } = await db.auth.getSession();

  if (!data.session) return;

  currentUser = data.session.user;

  const { data: isAdmin, error } =
    await db.rpc("is_directory_admin");

  if (error || !isAdmin) {
    await db.auth.signOut();
    currentUser = null;
    return;
  }

  loginSection.classList.add("hidden");
  dashboardSection.classList.remove("hidden");
  logoutButton.classList.remove("hidden");

  await loadContacts();
}

checkExistingSession();
</script>

</body>
</html>
